# ---------------------------------------------------------------------------
# Chuech CMS — the admin Pages project (`cms2chuech`).
#
# Binding names are FIXED: DB, MEDIA, CACHE. The public-site project binds the
# same database, bucket and KV namespace, so these names must match
# `site-integration/wrangler.toml` exactly.
#
# The project name below is real. The `<...>` resource ids and `example.com`
# origins still need the values already present in the Cloudflare account; the
# local D1/R2/KV names are retained so `db:migrate:local` keeps working. Nothing
# here is a secret — set secrets with `wrangler pages secret put`.
#
# CAUTION: while a Pages project has bindings/vars in the dashboard, deploying
# with this file makes it the source of truth. Copy every dashboard-only
# setting into this file before the first successful remote deploy.
# ---------------------------------------------------------------------------

name = "cms2chuech"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# --- D1: structured content, form submissions, media index -------------------
# TODO(owner): replace the local name and placeholder ids with the shared
# production/preview databases before deploying.
[[d1_databases]]
binding = "DB"
database_name = "marino-cms"
database_id = "<prod id from `wrangler d1 create marino-cms`>"
preview_database_id = "<preview id from `wrangler d1 create marino-cms-preview`>"
# Migrations live once, at the repo root, and are shared with the site project.
migrations_dir = "../migrations"

# --- R2: the shared media bucket (existing objects untouched) ----------------
# TODO(owner): replace with the bucket already shared with the public site.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "marino-media"
# Preview uploads use the same bucket under the `uploads/` prefix, tagged
# source = 'upload' in the preview D1 only (spec §9.1). Point this at a
# separate bucket if you would rather keep previews fully isolated.
preview_bucket_name = "marino-media"

# --- KV: content_version (cache-busting) + form rate-limit counters ----------
# TODO(owner): replace the placeholder ids with the shared CACHE namespace.
[[kv_namespaces]]
binding = "CACHE"
id = "<prod id from `wrangler kv namespace create CACHE`>"
preview_id = "<preview id from `wrangler kv namespace create CACHE --preview-name ...`>"

# --- Plain variables (public; no secrets here) -------------------------------
[vars]
# TODO(owner): set before the first remote deploy — see docs/cloudflare-setup.md §4 and §11.
MEDIA_PUBLIC_BASE = "https://media.example.com"
SITE_ORIGIN = "https://example.com"
CMS_ORIGIN = "https://cms.example.com"
CF_ACCESS_TEAM_DOMAIN = "<team>.cloudflareaccess.com"
BOOTSTRAP_ADMIN_EMAIL = "owner@example.com"

# --- Local development only (.dev.vars, never in Cloudflare) -----------------
# Create .dev.vars at the repo root (the directory `npm run dev:cms` runs in):
#   DEV_USER_EMAIL=you@example.com
# It is git-ignored and is the ONLY way the admin API bypasses Access.
